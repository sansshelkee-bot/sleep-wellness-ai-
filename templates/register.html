{% extends "base.html" %}

{% block title %}Create Account - SleepTwin AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="stat-icon primary mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Create Your Account</h3>
                    <p class="text-muted small">Initialize your personalized AI Sleep Digital Twin</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label small fw-semibold text-muted">Full Name *</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-muted">Email Address *</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="age" class="form-label small fw-semibold text-muted">Age (Years)</label>
                            <input type="number" class="form-control" id="age" name="age" min="15" max="100" value="30">
                        </div>
                        <div class="col-sm-6">
                            <label for="gender" class="form-label small fw-semibold text-muted">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="occupation" class="form-label small fw-semibold text-muted">Occupation</label>
                        <select class="form-select" id="occupation" name="occupation">
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="Doctor">Doctor</option>
                            <option value="Nurse">Nurse</option>
                            <option value="Teacher">Teacher</option>
                            <option value="Engineer">Engineer</option>
                            <option value="Lawyer">Lawyer</option>
                            <option value="Accountant">Accountant</option>
                            <option value="Salesperson">Salesperson</option>
                            <option value="Scientist">Scientist</option>
                            <option value="Manager">Manager</option>
                            <option value="Other" selected>Other</option>
                        </select>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-sm-6">
                            <label for="password" class="form-label small fw-semibold text-muted">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 chars" required minlength="6">
                        </div>
                        <div class="col-sm-6">
                            <label for="confirm_password" class="form-label small fw-semibold text-muted">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm password" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                        <i class="bi bi-person-check me-1"></i> Register & Initialize Twin
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <p class="text-muted small mb-0">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
